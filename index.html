<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITOF 2026 Navigator</title>
<style>
/* Farben nach Styleguide sachsen.de: Primärfarbe Grün mit Abstufungen 10/20/40 %, Graustufen, Rot nur für Warnhinweise */
:root{
  --g100:#337E33; --g40:#ADCBAD; --g20:#D6E5D6; --g10:#EBF2EB; --gdark:#00590B;
  --ink:#313131; --muted:#666666; --line:#E2E2E2; --bg:#F6F6F6; --surface:#FFFFFF; --warn:#B0001F; --warnbg:#FEF3EA;
  --font:"Rotis Sans Serif",Arial,Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --g100:#7FB77F; --g40:#3F6B3F; --g20:#2A472A; --g10:#1D2B1D; --gdark:#ADCBAD;
  --ink:#ECECEC; --muted:#B5B5B5; --line:#3A3A3A; --bg:#1B1B1B; --surface:#242424; --warn:#FF8A8A; --warnbg:#3A2323;}}
:root[data-theme="dark"]{--g100:#7FB77F; --g40:#3F6B3F; --g20:#2A472A; --g10:#1D2B1D; --gdark:#ADCBAD;
  --ink:#ECECEC; --muted:#B5B5B5; --line:#3A3A3A; --bg:#1B1B1B; --surface:#242424; --warn:#FF8A8A; --warnbg:#3A2323;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g100);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:4px solid var(--g100)}
header.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand h1{margin:0;font-size:22px;font-weight:700;color:var(--ink)}
.brand span{color:var(--muted);font-size:14px}
.disc{margin:-4px 0 10px;font-size:12.5px;color:var(--muted)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--g100);margin-bottom:12px}
.days button{border:0;background:var(--surface);padding:8px 10px;text-align:left;color:var(--g100)}
.days button+button{border-left:1px solid var(--g100)}
.days button b{display:block;font-size:16px}
.days button small{font-size:13px}
.days button[aria-pressed="true"]{background:var(--g100);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .days button[aria-pressed="true"]{color:#1B1B1B}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:12px 2px 14px;font-size:15px;color:var(--muted);border-top:4px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--g100);font-weight:700;border-top-color:var(--g100)}
nav.tabs .count{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;background:var(--g100);color:#fff;border-radius:11px;font-size:13px;line-height:20px}
h2.sec{font-size:20px;font-weight:700;margin:24px 0 10px;color:var(--ink)}
.hint{color:var(--muted);font-size:14px;margin:6px 0 12px}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap}
.lv i{font-style:normal;display:inline-grid;place-items:center;min-width:30px;height:22px;background:var(--g100);color:#fff;padding:0 5px}
.lv[data-l="0"] i{background:var(--muted)}
.trk{color:var(--muted);font-size:14px}
.now{margin-top:16px;background:var(--g10);border-left:6px solid var(--g100);padding:12px 14px}
.now h3{margin:0 0 4px;font-size:14px;color:var(--gdark)}
.now .big{font-size:20px;font-weight:700;margin:2px 0;line-height:1.25}
.now p{margin:4px 0}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:62px 1fr;gap:10px;margin:0 0 10px}
.tl .t{font-size:20px;font-weight:700;padding-top:10px;text-align:right;color:var(--g100)}
.tl .t small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--g40);padding:10px 12px}
.card.sel{border-left-color:var(--g100)}
.card.live{background:var(--g10);border-color:var(--g100)}
.card h4{margin:6px 0 2px;font-size:17px;line-height:1.3}
.card .who{color:var(--muted);font-size:14.5px;margin:2px 0 0}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.card .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;padding:1px 7px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.rec{background:var(--g20);color:var(--gdark);border-color:var(--g40);font-weight:700}
.tag.alt{background:var(--g10);color:var(--gdark);border-color:var(--g20)}
.tag.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn);font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--g100);background:var(--surface);color:var(--g100);padding:6px 12px;font-size:14.5px}
.btn.on,.btn.primary{background:var(--g100);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.on,:root:not([data-theme="light"]) .btn.primary{color:#1B1B1B}}
.btn.plain{border-color:var(--line);color:var(--ink)}
.move{grid-column:2;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;margin:-4px 0 8px}
.move::before{content:"";width:18px;border-top:2px dotted var(--g100)}
.awayblk{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 14px);border:1px dashed var(--muted);padding:10px 12px}
.awayblk b{font-size:16px}
.awayblk .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:14.5px}
.awayblk input[type=time]{border:1px solid var(--line);padding:3px 6px;background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--g40);padding:16px}
.empty p{margin:0 0 10px}
.filters{display:grid;gap:8px;margin-top:16px}
.filters input,.filters select{width:100%;border:1px solid var(--line);padding:8px 10px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--g100);background:var(--surface);color:var(--g100);padding:4px 11px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--g100);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1B1B1B}}
.slot{font-size:22px;font-weight:700;margin:24px 0 8px;display:flex;align-items:baseline;gap:10px;color:var(--g100);border-bottom:1px solid var(--g40);padding-bottom:4px}
.slot small{font-size:14px;font-weight:400;color:var(--muted)}
.plist{display:grid;gap:8px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--g100);margin-top:16px}
.levels button{border:0;background:var(--surface);color:var(--g100);padding:8px;font-weight:700}
.levels button+button{border-left:1px solid var(--g100)}
.levels button[aria-pressed="true"]{background:var(--g100);color:#fff}
.mapbox{margin-top:10px;border:1px solid var(--line);overflow:auto;background:#fff;max-height:70vh;-webkit-overflow-scrolling:touch}
.map{position:relative;width:100%}
.map.z{width:210%}
.map img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;line-height:1;white-space:nowrap;pointer-events:none}
.pin.room{background:#313131;color:#fff;padding:3px 6px;opacity:.9}
.pin.stand{width:14px;height:14px;border-radius:50%;border:3px solid #fff;background:#337E33;box-shadow:0 0 0 2px #337E33}
.pin.target{width:46px;height:46px;border-radius:50%;border:4px solid #337E33;background:rgba(51,126,51,.2);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4);opacity:.25}}
@media (prefers-reduced-motion:reduce){.pin.target{animation:none}}
.maptools{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:14.5px}
.stands{display:grid;gap:6px;margin-top:10px}
.stand{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:7px 10px}
.stand .no{font-weight:700;min-width:40px;color:var(--g100)}
.stand .nm{font-size:15px}
.stand .ic{display:flex;gap:6px}
.stand .btn{padding:4px 9px;font-size:13.5px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--g100);margin-top:16px}
.seg button{border:0;background:var(--surface);color:var(--g100);padding:9px;font-weight:700}
.seg button+button{border-left:1px solid var(--g100)}
.seg button[aria-pressed="true"]{background:var(--g100);color:#fff}
.oe-form{display:grid;gap:10px;margin-top:12px;background:var(--surface);border:1px solid var(--line);padding:12px}
.oe-form label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.oe-form input,.oe-form select{border:1px solid var(--line);padding:8px 10px;background:var(--surface);width:100%}
.fixed{font-weight:700;padding:8px 10px;background:var(--g10);border:1px solid var(--g20)}
.sugg{display:grid;border:1px solid var(--line);border-top:0}
.sugg button{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:8px 10px}
.sugg button:hover{background:var(--g10)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--g100);padding:10px 12px;margin-top:10px}
.trip .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.trip .hd b{font-size:20px;color:var(--g100)}
.trip ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.trip li{font-size:14.5px;border-top:1px dotted var(--line);padding-top:6px}
.line{display:inline-block;min-width:34px;text-align:center;background:var(--g100);color:#fff;font-weight:700;padding:0 5px;margin-right:6px}
.late{color:var(--warn);font-weight:700}
.ontime{color:var(--g100);font-weight:700}
.deps{display:grid;gap:0;margin-top:8px;background:var(--surface);border:1px solid var(--line)}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.dep:first-child{border-top:0}
.dep .in{font-weight:700;font-size:18px;color:var(--g100);text-align:right}
.msg{background:var(--warnbg);border:1px solid var(--warn);padding:10px 12px;margin-top:10px;font-size:14.5px}
.msg a,.foot a{color:var(--g100)}
.foot{color:var(--muted);font-size:13px;margin-top:28px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<header class="top"><div class="wrap">

  <div class="days" role="group" aria-label="Tag wählen">

    <button data-day="2"><b>Mittwoch 23.9.</b><small>08:00–15:00</small></button>
  </div>
</div></header>

<main class="wrap" id="main"></main>

</div></nav>

let D=JSON.parse(document.getElementById("itof-data").textContent);

const m=t=>{const[h,mi]=t.split(":").map(Number);return h*60+mi};
const hm=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
let SES=[],BYID={},RM={},STANDS=[];
function prepare(){
  RM=D.raeume; STANDS=D.staende;
  SES=D.beitraege.map(b=>({...b,s:m(b.beginn),e:m(b.ende)}));
  BYID=Object.fromEntries(SES.map(x=>[x.id,x]));
}
prepare();

const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let plan=store.get("itof26-ablauf-v2",[]);
let away=store.get("itof26-away-v2",{1:{on:false,s:"12:30",e:"13:30"},2:{on:false,s:"12:30",e:"13:30"}});
let myStands=store.get("itof26-staende-v2",[]);
const today=new Date(); const iso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
const liveDay=iso===D.meta.tage["1"]?1:iso===D.meta.tage["2"]?2:0;
let state={day:liveDay||store.get("itof26-day",1),view:"prog",filters:{tr:[],room:"",q:"",rec:false},map:{l:2,target:null,zoom:false}};
const save=()=>{store.set("itof26-ablauf-v2",plan);store.set("itof26-away-v2",away);store.set("itof26-staende-v2",myStands);store.set("itof26-day",state.day)};

const lvl=x=>RM[x.raum].ebene;
const lvBadge=x=>{const r=RM[x.raum];return `<span class="lv" data-l="${r.ebene}"><i>${r.ebene?"E"+r.ebene:"–"}</i>${r.name}${r.ortUnsicher?" (Ort?)":""}</span>`};
const trk=x=>`<span class="trk">${D.straenge[x.strang].name}</span>`;
const sameShortSlot=(a,b)=>a.kurzvortrag&&b.kurzvortrag&&a.raum===b.raum&&a.s===b.s;
const overlap=(a,b)=>a.s<b.e&&b.s<a.e&&!sameShortSlot(a,b);
const conflicts=x=>plan.map(id=>BYID[id]).filter(y=>y&&y.id!==x.id&&y.tag===x.tag&&overlap(x,y));
function inAway(x){const a=away[x.tag];return !!(a&&a.on&&x.s<m(a.e)&&m(a.s)<x.e)}
const timeLabel=x=>`${x.zeitGeschaetzt?"ca. ":""}${hm(x.s)}–${hm(x.e)}`;
function flags(x,inPlan){
  const f=[];
  if(x.kurzvortrag) f.push('<span class="tag">Kurzvortrag 10 min im Halbstunden-Slot</span>');
  if(x.zeitGeschaetzt) f.push('<span class="tag">Zeit aus Rasterposition geschätzt</span>');
  if(inPlan){const c=conflicts(x); if(c.length) f.push(`<span class="tag warn">Überschneidung mit ${c.length} Termin${c.length>1?"en":""}</span>`);}
  if(inAway(x)) f.push('<span class="tag warn">in deiner Pause</span>');
  if(x.hinweis) f.push(`<span class="tag">${x.hinweis}</span>`);
  return f.length?`<div class="flags">${f.join("")}</div>`:"";
}
function card(x,o={}){
  const inP=plan.includes(x.id);
  return `<article class="card${inP?" sel":""}${o.live?" live":""}">
    <div class="meta">${lvBadge(x)}${trk(x)}</div>
    <h4>${x.titel}</h4><p class="who">${x.mitwirkende}</p>
    ${o.showTime?`<p class="who"><b>${timeLabel(x)}</b></p>`:""}
    ${flags(x,inP)}
    <div class="acts">
      <button class="btn ${inP?"on":""}" data-toggle="${x.id}" aria-pressed="${inP}">${inP?"Im Ablauf ✓":"Zum Ablauf hinzufügen"}</button>
      ${RM[x.raum].ebene?`<button class="btn plain" data-locate="${x.raum}">Auf Karte zeigen</button>`:""}
    </div></article>`;
}
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};

function viewProg(){
  const d=state.day,f=state.filters;
  let list=SES.filter(x=>x.tag===d);
  if(f.tr.length) list=list.filter(x=>f.tr.includes(x.strang));
  if(f.room) list=list.filter(x=>x.raum===f.room);
  if(f.q){const q=f.q.toLowerCase();list=list.filter(x=>(x.titel+" "+x.mitwirkende).toLowerCase().includes(q))}
  const order=Object.keys(RM);
  list.sort((a,b)=>a.s-b.s||order.indexOf(a.raum)-order.indexOf(b.raum)||String(a.spalte).localeCompare(String(b.spalte)));
  let h=`<div class="filters">
    <input type="search" placeholder="Suche nach Titel, Person, Organisation" value="${f.q}" data-f="q" aria-label="Suche">
    <div class="chips">${Object.entries(D.straenge).filter(([k])=>k!=="PL").map(([k,t])=>`<button class="chip" data-ftr="${k}" aria-pressed="${f.tr.includes(k)}">${t.name}</button>`).join("")}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <select data-f="room" aria-label="Raum" style="flex:1 1 180px;width:auto"><option value="">Alle Räume</option>${Object.entries(RM).filter(([k])=>k!=="ALL").map(([k,r])=>`<option value="${k}" ${f.room===k?"selected":""}>E${r.ebene} ${r.name}</option>`).join("")}</select>
    </div></div>`;
  if(!list.length) return h+`<div class="empty" style="margin-top:14px"><p>Keine Beiträge für diese Filter.</p><button class="btn" data-clear>Filter zurücksetzen</button></div>`;
  let cur=null;
  for(const x of list){
    if(x.s!==cur){if(cur!==null)h+="</div>";cur=x.s;
      const aw=inAway({tag:d,s:x.s,e:x.s+1})?"<small>während deiner Pause</small>":"";
      h+=`<div class="slot">${hm(x.s)} ${aw}</div><div class="plist">`;}
    h+=card(x,{showTime:true});
  }
  return h+"</div>";
}

function viewPlan(){
  const d=state.day,a=away[d],n=nowMin();
  const items=plan.map(id=>BYID[id]).filter(x=>x&&x.tag===d).sort((p,q)=>p.s-q.s||p.e-q.e);
  let h="";
  if(liveDay===d){
    const cur=items.filter(x=>x.s<=n&&n<x.e), nxt=items.find(x=>x.s>n);
    let body;
    if(a.on&&n>=m(a.s)&&n<m(a.e)) body=`<p class="big">Pause / eigener Termin</p><p>bis ${a.e}</p>`;
    else if(cur.length) body=cur.map(x=>`<p class="big">${x.titel}</p><p>${lvBadge(x)} bis ${hm(x.e)}</p>`).join("");
    else body=`<p class="big">Gerade nichts geplant</p>`;
    if(nxt) body+=`<p style="margin-top:10px"><b>Als Nächstes in ${nxt.s-n} min (${hm(nxt.s)}):</b> ${nxt.titel}</p><p>${lvBadge(nxt)} <button class="btn plain" data-locate="${nxt.raum}">Weg zeigen</button></p>`;
    h+=`<section class="now" aria-live="polite"><h3>Jetzt, ${hm(n)} Uhr</h3>${body}</section>`;
  }
  h+=`<h2 class="sec">Mein Ablauf am ${d===1?"Dienstag":"Mittwoch"}</h2>`;
  if(!items.length) h+=`<div class="empty"><p>Dein Ablauf ist noch leer. Wähle im Programm Beiträge aus, sie erscheinen dann hier in zeitlicher Reihenfolge.</p><button class="btn primary" data-view="prog">Zum Programm</button></div>`;
  const rows=[...items.map(x=>({k:"s",t:x.s,x})),...(a.on?[{k:"away",t:m(a.s)}]:[])].sort((p,q)=>p.t-q.t||(p.k==="away"?1:-1));
  h+='<ol class="tl" style="margin-top:12px">'; let prev=null;
  for(const r of rows){
    if(r.k==="away"){
      h+=`<li><div class="t">${a.s}<small>bis ${a.e}</small></div><div class="awayblk">
        <b>Pause / eigener Termin</b>
        <div class="row"><button class="btn plain" data-away-off>Entfernen</button>
        <label>von <input type="time" data-away="s" value="${a.s}"></label>
        <label>bis <input type="time" data-away="e" value="${a.e}"></label></div></div></li>`;
      prev=null; continue;}
    const x=r.x;
    if(prev&&lvl(prev)&&lvl(x)&&lvl(prev)!==lvl(x)) h+=`<li><span class="move">Ebenenwechsel: E${lvl(prev)} → E${lvl(x)}, ${RM[x.raum].name}</span></li>`;
    h+=`<li><div class="t">${hm(x.s)}<small>${x.zeitGeschaetzt?"ca. ":""}bis ${hm(x.e)}</small></div>${card(x,{live:liveDay===d&&x.s<=n&&n<x.e})}</li>`;
    prev=x;
  }
  h+="</ol>";
  if(!a.on) h+=`<div class="acts"><button class="btn plain" data-away-add>Pause oder eigenen Termin eintragen</button></div>`;
  const st=myStands.map(no=>STANDS.find(s=>s.nr===no)).filter(Boolean);
  h+=`<h2 class="sec">Stände auf meiner Liste</h2>`;
  h+=st.length?`<div class="stands">${st.map(standRow).join("")}</div>`:`<div class="empty"><p>Keine Stände gemerkt. Unter „Karte“ kannst du Stände hinzufügen.</p></div>`;
  if(plan.length) h+=`<div class="acts" style="margin-top:18px"><button class="btn plain" data-copy>Ablauf als Text kopieren</button><button class="btn plain" data-reset>Ablauf leeren</button></div>`;
  h+=`<p class="foot">Quelle: ${D.meta.quelle}, Stand ${D.meta.programmstand}. Zeiten mit „ca.“ sind im Programm nicht beschriftet und aus der Position im Raster geschätzt. Deine Auswahl wird nur in diesem Browser gespeichert. Privat erstellter Navigator ohne Gewähr, kein offizielles Angebot des Veranstalters oder des Freistaates Sachsen.</p>`;
  return h;
}

function standRow(s){
  const mine=myStands.includes(s.nr);
  return `<div class="stand"><span class="no">${s.nr}</span><span class="nm">${s.name}</span><span class="ic">
    <button class="btn plain" data-locate-stand="${s.nr}">Zeigen</button>
    <button class="btn ${mine?"on":""}" data-stand="${s.nr}" aria-pressed="${mine}">${mine?"Gemerkt":"Merken"}</button></span></div>`;
}
function viewMap(){
  const L=state.map.l,c=D.ebenen[L].ausschnitt,t=state.map.target;
  const pct=(x,y)=>`left:${((x-c.x)/c.w*100).toFixed(2)}%;top:${((y-c.y)/c.h*100).toFixed(2)}%`;
  let pins="";
  for(const r of Object.values(RM)) if(r.ebene===L&&r.ortUnsicher) pins+=`<span class="pin room" style="${pct(r.x,r.y)}">${r.name}${r.ortUnsicher?" ?":""}</span>`;
  for(const s of STANDS) if(s.ebene===L&&myStands.includes(s.nr)) pins+=`<span class="pin stand" style="${pct(s.x,s.y)}"></span>`;
  for(const p of (D.orientierung[L]||[])) pins+=`<span class="pin room" style="${pct(p.x,p.y)};background:#6E6E6E">${p.name}</span>`;
  let note=`<span class="hint" style="margin:0">Gemerkte Stände sind grün markiert.</span>`;
  if(t&&t.l===L){pins+=`<span class="pin target" style="${pct(t.x,t.y)}"></span>`;note=`<span>Markiert: <b>${t.label}</b>, Ebene ${L}</span>`}
  const sug=D.standVorschlaege;
  return `<div class="levels" role="group" aria-label="Ebene">${[1,2,3].map(l=>`<button data-level="${l}" aria-pressed="${l===L}">Ebene ${l}</button>`).join("")}</div>
    <div class="maptools">${note}<button class="btn plain" data-zoom>${state.map.zoom?"Verkleinern":"Vergrößern"}</button></div>
    <div class="mapbox" id="mapbox"><div class="map ${state.map.zoom?"z":""}"><img src="${IMG[L]}" alt="Standplan Ebene ${L}">${pins}</div></div>
    ${L===3?`<p class="hint">Die SID-Stage ist im Lageplan nicht beschriftet. Markiert ist die Bühne neben dem SID-Stand 03-02; das ist eine Vermutung, bitte vor Ort prüfen. Stand 03-03 (KISA + LECOS) ist im Plan versehentlich als „03-02“ beschriftet.</p>`:""}
    <h2 class="sec">Stände auf Ebene ${L}</h2>
    <div class="stands">${STANDS.filter(s=>s.ebene===L).sort((a,b)=>sug.includes(b.nr)-sug.includes(a.nr)).map(standRow).join("")}</div>`;
}

const main=document.getElementById("main");
function render(){
  document.querySelectorAll(".days button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.day===state.day)));
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.view===state.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const cnt=plan.filter(id=>BYID[id]&&BYID[id].tag===state.day).length;
  document.getElementById("cnt").textContent=cnt||""; document.getElementById("cnt").style.display=cnt?"":"none";
  main.innerHTML=state.view==="plan"?viewPlan():state.view==="prog"?viewProg():state.view==="oepnv"?viewOepnv():viewMap();
  if(state.view==="oepnv") oeAfterRender();
  if(state.view==="map"&&state.map.target&&state.map.zoom){
    const box=document.getElementById("mapbox"),t=state.map.target,c=D.ebenen[state.map.l].ausschnitt;
    requestAnimationFrame(()=>{box.scrollLeft=(t.x-c.x)/c.w*box.scrollWidth-box.clientWidth/2;box.scrollTop=(t.y-c.y)/c.h*box.scrollHeight-box.clientHeight/2});
  }
  save();
}
function locate(label,l,x,y){state.map={l,target:{label,l,x,y},zoom:true};state.view="map";render();window.scrollTo({top:0})}
const keep=fn=>{const y=window.scrollY;fn();render();window.scrollTo({top:y})};
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const ds=b.dataset;
  if(ds.day){state.day=+ds.day;render();return}
  if(ds.view){state.view=ds.view;render();window.scrollTo({top:0});return}
  if(ds.toggle){keep(()=>{plan=plan.includes(ds.toggle)?plan.filter(i=>i!==ds.toggle):[...plan,ds.toggle]});return}
  if(ds.locate){const r=RM[ds.locate];locate(r.name,r.ebene,r.x,r.y);return}
  if(ds.locateStand){const s=STANDS.find(s=>s.nr===ds.locateStand);locate(`Stand ${s.nr} ${s.name}`,s.ebene,s.x,s.y);return}
  if(ds.stand){keep(()=>{myStands=myStands.includes(ds.stand)?myStands.filter(i=>i!==ds.stand):[...myStands,ds.stand]});return}
  if(ds.level){state.map.l=+ds.level;render();return}
  if("zoom" in ds){state.map.zoom=!state.map.zoom;render();return}
  if(ds.ftr){keep(()=>{const f=state.filters;f.tr=f.tr.includes(ds.ftr)?f.tr.filter(i=>i!==ds.ftr):[...f.tr,ds.ftr]});return}
  if("awayAdd" in ds){away[state.day].on=true;render();return}
  if("awayOff" in ds){away[state.day].on=false;render();return}
  if("clear" in ds){state.filters={tr:[],room:"",q:"",rec:false};render();return}
  if("reset" in ds){if(confirm("Deinen Ablauf für beide Tage leeren?")){plan=[];render()}return}
  if("copy" in ds){
    const txt=[1,2].flatMap(d=>[d===1?"Dienstag 22.9.":"Mittwoch 23.9.",...plan.map(id=>BYID[id]).filter(x=>x&&x.tag===d).sort((a,b)=>a.s-b.s).map(x=>`${timeLabel(x)}  E${RM[x.raum].ebene||"-"} ${RM[x.raum].name}: ${x.titel}`),""]).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{b.textContent="Kopiert"}).catch(()=>{b.textContent="Kopieren nicht möglich"});
    return}
});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.f==="q"){state.filters.q=el.value;const pos=el.selectionStart;render();const n=main.querySelector('[data-f="q"]');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.f==="room"){state.filters.room=el.value;render()}
  if(el.dataset.away){away[state.day][el.dataset.away]=el.value;render()}
  if("awayOn" in el.dataset){away[state.day].on=el.checked;render()}});

/* ---------- ÖPNV (VVO WebAPI, inoffiziell dokumentiert) ---------- */
const API="https://webapi.vvo-online.de";
const MOT={Tram:"Straßenbahn",SuburbanRailway:"S-Bahn",RapidTransit:"S-Bahn",Train:"Zug",CityBus:"Bus",IntercityBus:"Regionalbus",Bus:"Bus",RegioBus:"Regionalbus",PlusBus:"PlusBus",HailedSharedTaxi:"Rufbus",BusOnRequest:"Bus",Ferry:"Fähre",Cableway:"Seilbahn"};
const MOTFILTER={Alle:null,"S-Bahn/Zug":["SuburbanRailway","Train"],"Straßenbahn":["Tram"],"Bus":["CityBus","IntercityBus","HailedSharedTaxi"]};
let oe={dir:store.get("itof26-oe-dir","hin"),place:store.get("itof26-oe-ort",null),airport:store.get("itof26-oe-flughafen",null),
  mode:"jetzt",date:"",time:"",trips:null,loading:false,err:"",deps:null,depErr:"",depLoading:false,depFilter:"Alle",sugg:[]};
const pd=s=>{const x=/(-?\d+)/.exec(s||"");return x?new Date(+x[1]):null};
const hhmm=d=>d?d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function withTimeout(p,ms=15000){let to;const t=new Promise((_,rej)=>{to=setTimeout(()=>rej(new Error("Zeitüberschreitung")),ms)});try{return await Promise.race([p,t])}finally{clearTimeout(to)}}
async function apiPost(path,body){
  const payload=JSON.stringify({...body,format:"json"});
  let r;
  try{r=await withTimeout(fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json;charset=UTF-8"},body:payload}))}
  catch(e){r=await withTimeout(fetch(API+path,{method:"POST",body:payload}))}
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json(); if(j.Status&&j.Status.Code!=="Ok") throw new Error(j.Status.Code); return j;
}
async function findStops(q){
  const r=await withTimeout(fetch(`${API}/tr/pointfinder?query=${encodeURIComponent(q)}&stopsOnly=true&limit=8&format=json`));
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  return (j.Points||[]).map(p=>p.split("|")).filter(a=>/^\d+$/.test(a[0])).map(a=>({id:a[0],name:a[3],city:a[2]||""}));
}
async function ensureAirport(){
  if(oe.airport) return oe.airport;
  const list=await findStops("Dresden Flughafen");
  const hit=list.find(s=>/flughafen/i.test(s.name))||list[0];
  if(!hit) throw new Error("Haltestelle Flughafen nicht gefunden");
  oe.airport=hit; store.set("itof26-oe-flughafen",hit); return hit;
}
const errText=e=>/fetch|network|load failed/i.test(e&&e.message||"")?"keine Verbindung zum VVO-Server":(e&&e.message)||"unbekannter Fehler";
const stopLabel=s=>s?`${s.name}${s.city?", "+s.city:""}`:"";
function delayHtml(plan,real){
  if(!real||!plan) return "";
  const d=Math.round((real-plan)/60000);
  return d>0?` <span class="late">+${d}</span>`:` <span class="ontime">pünktlich</span>`;
}
function fallbackLinks(){return `Zur Kontrolle: <a href="https://www.vvo-online.de/" target="_blank" rel="noopener">VVO-Fahrplanauskunft</a>, <a href="https://www.dvb.de/" target="_blank" rel="noopener">DVB</a> oder <a href="https://www.bahn.de/" target="_blank" rel="noopener">bahn.de</a>.`}
function tripHtml(r){
  const legs=r.PartialRoutes||[];
  const first=legs.find(l=>(l.RegularStops||[]).length), last=[...legs].reverse().find(l=>(l.RegularStops||[]).length);
  const s0=first&&first.RegularStops[0], sN=last&&last.RegularStops[last.RegularStops.length-1];
  const dep=s0&&(pd(s0.DepartureRealTime)||pd(s0.DepartureTime)), arr=sN&&(pd(sN.ArrivalRealTime)||pd(sN.ArrivalTime));
  const items=legs.map(l=>{
    const m=l.Mot||{}, st=l.RegularStops||[];
    if(m.Type==="Footpath") return `<li>Fußweg, ${l.Duration||"?"} min</li>`;
    if(!st.length||/^(Stay|Mobility)/.test(m.Type||"")) return "";
    const a=st[0], b=st[st.length-1];
    const pl=a.Platform&&a.Platform.Name?`, ${a.Platform.Type==="Railtrack"?"Gleis":"Steig"} ${esc(a.Platform.Name)}`:"";
    return `<li><span class="line">${esc(m.Name||"")}</span>${MOT[m.Type]||esc(m.Type)} Richtung ${esc((m.Direction||"").trim())}${l.TripCancelled?' <span class="late">fällt aus</span>':""}<br>
      ab ${hhmm(pd(a.DepartureTime))}${delayHtml(pd(a.DepartureTime),pd(a.DepartureRealTime))} ${esc(a.Name)}${pl}<br>
      an ${hhmm(pd(b.ArrivalTime))}${delayHtml(pd(b.ArrivalTime),pd(b.ArrivalRealTime))} ${esc(b.Name)}</li>`;
  }).join("");
  const warn=(r.RouteCancelled?' <span class="late">Verbindung fällt aus</span>':"")+(legs.some(l=>l.ChangeoverEndangered)?' <span class="late">Anschluss gefährdet</span>':"");
  return `<div class="trip"><div class="hd"><b>${hhmm(dep)} → ${hhmm(arr)}</b><span>${r.Duration} min, ${r.Interchanges} Umstieg${r.Interchanges===1?"":"e"}</span></div>${warn}<ol>${items}</ol></div>`;
}
function depsHtml(){
  if(oe.depLoading) return `<p class="hint">Lade Abfahrten …</p>`;
  if(oe.depErr) return `<div class="msg">Abfahrten konnten nicht geladen werden (${esc(oe.depErr)}). ${fallbackLinks()}</div>`;
  if(!oe.deps) return "";
  const f=MOTFILTER[oe.depFilter]; const list=oe.deps.filter(d=>!f||f.includes(d.Mot));
  if(!list.length) return `<p class="hint">Keine passenden Abfahrten in der nächsten Zeit.</p>`;
  const now=Date.now();
  return `<div class="deps">${list.map(d=>{const plan=pd(d.ScheduledTime),real=pd(d.RealTime)||plan;const mins=Math.max(0,Math.round((real-now)/60000));
    return `<div class="dep"><span class="line">${esc(d.LineName)}</span><span>${MOT[d.Mot]||esc(d.Mot)} Richtung <b>${esc(d.Direction)}</b><br><small>${hhmm(plan)}${delayHtml(plan,pd(d.RealTime))}${d.Platform&&d.Platform.Name?`, ${d.Platform.Type==="Railtrack"?"Gleis":"Steig"} ${esc(d.Platform.Name)}`:""}${(d.CancelReasons||[]).length?' <span class="late">fällt aus</span>':""}</small></span><span class="in">${mins} min</span></div>`}).join("")}</div>`;
}
function viewOepnv(){
  const hin=oe.dir==="hin";
  const air=oe.airport?stopLabel(oe.airport):"Flughafen Dresden";
  const placeField=`<div><input id="oe-q" type="search" placeholder="${hin?"Start":"Ziel"}haltestelle suchen, z. B. Meißen Bahnhof" value="${esc(oe.place?stopLabel(oe.place):"")}" autocomplete="off"><div class="sugg" id="oe-sugg"></div></div>`;
  let res="";
  if(oe.loading) res=`<p class="hint">Suche Verbindungen …</p>`;
  else if(oe.err) res=`<div class="msg">Verbindungen konnten nicht geladen werden (${esc(oe.err)}). ${fallbackLinks()}</div>`;
  else if(oe.trips) res=oe.trips.length?oe.trips.map(tripHtml).join("")+`<div class="acts"><button class="btn plain" data-oe-later>Spätere Verbindungen</button></div>`:`<p class="hint">Keine Verbindungen gefunden.</p>`;
  return `<div class="seg" role="group" aria-label="Richtung">
      <button data-oe-dir="hin" aria-pressed="${hin}">Zur ITOF</button><button data-oe-dir="rueck" aria-pressed="${!hin}">Zurück</button></div>
    <div class="oe-form">
      ${hin?`<label>Von${placeField}</label><label>Nach<div class="fixed">${esc(air)}</div></label>`
           :`<label>Von<div class="fixed">${esc(air)}</div></label><label>Nach${placeField}</label>`}
      <div class="row2">
        <label>Zeitpunkt<select id="oe-mode"><option value="jetzt" ${oe.mode==="jetzt"?"selected":""}>Jetzt abfahren</option><option value="ab" ${oe.mode==="ab"?"selected":""}>Abfahrt um</option><option value="an" ${oe.mode==="an"?"selected":""}>Ankunft bis</option></select></label>
        <label>Tag und Uhrzeit<input id="oe-time" type="datetime-local" value="${esc(oe.time)}" ${oe.mode==="jetzt"?"disabled":""}></label>
      </div>
      <button class="btn primary" data-oe-search ${oe.place?"":"disabled"}>Verbindungen suchen</button>
    </div>
    ${res}
    <h2 class="sec">Nächste Abfahrten am Flughafen</h2>
    <div class="chips">${Object.keys(MOTFILTER).map(k=>`<button class="chip" data-oe-f="${k}" aria-pressed="${oe.depFilter===k}">${k}</button>`).join("")}<button class="chip" data-oe-deps>Aktualisieren</button></div>
    <div id="oe-deps">${depsHtml()}</div>
    <p class="foot">Echtzeitdaten über die öffentliche, inoffiziell dokumentierte WebAPI des Verkehrsverbunds Oberelbe (VVO); ohne Gewähr. Deine Starthaltestelle wird nur in diesem Browser gespeichert. ${fallbackLinks()}</p>`;
}
let oeTimer=null, oeLastSession=null;
function oeAfterRender(){
  const q=document.getElementById("oe-q"), box=document.getElementById("oe-sugg");
  if(q){ q.addEventListener("input",()=>{clearTimeout(oeTimer);const v=q.value.trim();
      if(v.length<3){box.innerHTML="";return}
      oeTimer=setTimeout(async()=>{try{const l=await findStops(v);oe.sugg=l;
        box.innerHTML=l.length?l.map((s,i)=>`<button data-oe-pick="${i}">${esc(stopLabel(s))}</button>`).join(""):`<p class="hint" style="padding:6px 10px;margin:0">Keine Haltestelle gefunden.</p>`}
        catch(e){box.innerHTML=`<div class="msg" style="margin:0">Haltestellensuche nicht erreichbar (${esc(errText(e))}).</div>`}},350)});}
  if(!oe.deps&&!oe.depLoading&&!oe.depErr) loadDeps();
}
async function loadDeps(){
  oe.depLoading=true;oe.depErr="";refreshDeps();
  try{const a=await ensureAirport();const j=await apiPost("/dm",{stopid:a.id,limit:30,shorttermchanges:true});oe.deps=j.Departures||[]}
  catch(e){oe.depErr=errText(e);oe.deps=null}
  oe.depLoading=false; if(state.view==="oepnv") render();
}
function refreshDeps(){const el=document.getElementById("oe-deps");if(el)el.innerHTML=depsHtml()}
function tripBody(a){
  const hin=oe.dir==="hin";
  const body={origin:hin?oe.place.id:a.id,destination:hin?a.id:oe.place.id,shorttermchanges:true,
    mobilitySettings:{mobilityRestriction:"None"},standardSettings:{maxChanges:"Unlimited",walkingSpeed:"Normal",footpathToStop:5,includeAlternativeStops:true,
    mot:["Tram","CityBus","IntercityBus","SuburbanRailway","Train","HailedSharedTaxi"]}};
  if(oe.mode!=="jetzt"&&oe.time){body.time=new Date(oe.time).toISOString();body.isarrivaltime=oe.mode==="an"}
  else body.time=new Date().toISOString();
  return body;
}
async function searchTrips(later){
  oe.loading=true;oe.err="";if(!later)oe.trips=null;render();
  try{const a=await ensureAirport();const body=tripBody(a);let j;
    if(later&&oeLastSession){j=await apiPost("/tr/prevnext",{...body,sessionId:oeLastSession,previous:false});oe.trips=[...(oe.trips||[]),...(j.Routes||[])]}
    else{j=await apiPost("/tr/trips",body);oe.trips=j.Routes||[]}
    oeLastSession=j.SessionId||oeLastSession;}
  catch(e){oe.err=errText(e)}
  oe.loading=false;render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const ds=b.dataset;
  if(ds.oeDir){oe.dir=ds.oeDir;store.set("itof26-oe-dir",oe.dir);oe.trips=null;oe.err="";render();return}
  if(ds.oePick!==undefined){oe.place=oe.sugg[+ds.oePick];store.set("itof26-oe-ort",oe.place);oe.sugg=[];oe.trips=null;render();return}
  if("oeSearch" in ds){if(oe.place)searchTrips(false);return}
  if("oeLater" in ds){searchTrips(true);return}
  if(ds.oeF){oe.depFilter=ds.oeF;render();return}
  if("oeDeps" in ds){loadDeps();return}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.id==="oe-mode"){oe.mode=el.value;if(oe.mode!=="jetzt"&&!oe.time){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);oe.time=d.toISOString().slice(0,16)}render()}
  if(el.id==="oe-time"){oe.time=el.value}});

render();
// Externe JSON-Datei bevorzugen, falls vorhanden (nur bei Auslieferung über einen Webserver)
if(location.protocol.startsWith("http")){
  fetch("itof26-programm.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.beitraege){D=j;prepare();plan=plan.filter(id=>BYID[id]);render()}}).catch(()=>{});
}
if(liveDay) setInterval(()=>{if(state.view==="plan"&&!(document.activeElement&&document.activeElement.matches("input")))render()},60000);
</script>
</body>
</html>
